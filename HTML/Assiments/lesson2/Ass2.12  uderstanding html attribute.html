<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attributes Practice</title>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>

        <nav>
            <a href="https://www.google.com" target="_blank" title="Visit Google">
                Visit Google
            </a>
        </nav>
    </header>

    <main>
        <section>
            <h2>My Favorite Car</h2>

            <img
                src="photos/Frarri.jpg"
                alt="A placeholder landscape image"
                width="300"
                height="200"
            >
        </section>

        <section>
            <h2>Contact Form</h2>

            <form action="#" method="post">

                <label for="name">Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

                <br><br>

                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <br><br>

                <button type="submit" title="Submit the form">
                    Submit
                </button>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

</body>
</html>
