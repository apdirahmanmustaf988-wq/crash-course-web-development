

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Text Properties</title>
    <link rel="stylesheet" href="style.css">
    <style>
        
body {
    background-color: #1d5a7a;
    font-family: Arial, sans-serif;
}

article {
    width: 600px;
    margin: 80px auto;
    padding: 30px;
    background-color: rgb(113, 128, 33);
}

/* Center the title */
h2 {
    text-align: center;
}

/* Comfortable spacing between lines */
p {
    line-height: 1.8;
    font-size: 18px;
}

/* Underline the important phrase */
.important {
    text-decoration: underline;
    font-weight: bold;
}
    </style>
</head>

<body>

    <article>
        <h2>Discovering CSS Text Properties</h2>

        <p>
            Exploring the vast capabilities of CSS can significantly improve
            the visual appeal of web content. Paying attention to
            <span class="important">text properties</span>
            not only enhances readability but also user engagement.
        </p>
    </article>

</body>
</html>
