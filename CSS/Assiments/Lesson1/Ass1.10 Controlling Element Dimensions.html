<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interests Page</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        

/* General Section Styling */
.interest-section {
    width: 80vw;
    height: 50vh;

    margin: 5vh auto;
    padding: 20px;

    box-sizing: border-box;

    border-radius: 15px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* Books Section */
#books {
    background-color: lightblue;
    border: 3px solid #3498db;
}

/* Movies Section */
#movies {
    background-color: lightgrey;
    border: 3px solid #555;
}

/* Foods Section */
#foods {
    background-color: lightgreen;
    border: 3px solid #27ae60;
}

/* Heading */
.interest-section h1 {
    font-size: 24px;
    margin-bottom: 10px;
}

/* Paragraph */
.interest-section p {
    font-size: 16px;
    margin: 0;
}

/* Center Text */
.interest-section h1,
.interest-section p {
    text-align: center;
}



    </style>
</head>

<body>

    <!-- Books -->
    <div class="interest-section" id="books">
        <h1>Books</h1>

        <ul>
            <li>Atomic Habits</li>
            <li>The Alchemist</li>
            <li>Rich Dad Poor Dad</li>
            <li>Think and Grow Rich</li>
        </ul>
    </div>

    <!-- Movies -->
    <div class="interest-section" id="movies">
        <h1>Movies</h1>

        <ul>
            <li>Inception</li>
            <li>Interstellar</li>
            <li>The Dark Knight</li>
            <li>Avengers: Endgame</li>
        </ul>
    </div>

    <!-- Foods -->
    <div class="interest-section" id="foods">
        <h1>Foods</h1>

        <ul>
            <li>Pizza</li>
            <li>Rice and Chicken</li>
            <li>Burger</li>
            <li>Pasta</li>
        </ul>
    </div>

</body>
</html>
