

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Quote</title>
    <style>
        body {
    background-color: #f4f4f4;
}

blockquote {
    width: 600px;
    margin: 100px auto;
    padding: 30px;
    background-color: white;
    border-left: 6px solid #2563eb;

    /* Quote font properties */
    font-family: Georgia, serif;
    font-size: 28px;
    font-style: italic;
}

blockquote footer {
    margin-top: 20px;

    /* Author font properties */
    font-family: Arial, sans-serif;
    font-size: 18px;
    font-weight: bold;
    font-style: normal;
}
    </style>
</head>

<body>

    <blockquote>
        "The only way to do great work is to love what you do."
        <footer>— Steve Jobs</footer>
    </blockquote>

</body>
</html>
