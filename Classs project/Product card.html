<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="product style.css">
</head>

<body>

    <div class="product-card">

        <div class="sawir">
            <img src="./image/headphones.jpeg" alt="Product Image">
        </div>

        <div class="product">

            <h1> Headphones</h1>

            <p>
               Premium over-ear wireless headphones with rich bass and
                clear sound, built-in microphone, comfortable ear
                 cushions, and up to 40 hours of battery life—perfect 
                 for music, calls, and everyday listening.
            </p>

            <div class="buttons">
                <button>Add to Cart</button>
                <button>Learn More</button>
            </div>

        </div>

    </div>

</body>
</html>
